  <h2 class="section-heading" id="about-me">关于我</h2>
  <p>我于 2026 年 8 月获得<a href="https://www.mtu.edu/">密歇根理工大学</a>土木工程博士学位，师从<a href="https://www.mtu.edu/cege/people/faculty-staff/faculty/you/">尤占平教授</a>。</p>
  <p>我的研究关注路面耐久性、沥青老化与黏附，以及废旧轮胎胶粉等再生材料的道路应用。我用分子模拟研究材料行为，并通过室内试验和现场验证评估其路用性能。</p>
