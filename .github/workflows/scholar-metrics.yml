name: Update Google Scholar metrics

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scholar-metrics

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Refresh the public metrics feed
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
        run: |
          set -eu
          if [ -z "$SERPAPI_API_KEY" ]; then
            echo "Add the SERPAPI_API_KEY repository secret to enable sync."
            exit 0
          fi

          python3 .github/scripts/refresh_scholar_metrics.py "$RUNNER_TEMP/scholar-metrics.json"
          existing_branch="$(git ls-remote --heads origin refs/heads/scholar-metrics)"
          if [ -n "$existing_branch" ]; then
            git fetch --depth=1 origin refs/heads/scholar-metrics
            git switch -C scholar-metrics FETCH_HEAD
          else
            git switch --orphan scholar-metrics
          fi

          cp "$RUNNER_TEMP/scholar-metrics.json" scholar-metrics.json
          git add scholar-metrics.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Refresh Google Scholar metrics'
          git push origin HEAD:refs/heads/scholar-metrics
