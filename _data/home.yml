publications:
  - url: https://doi.org/10.1111/mice.13325
    journal: Computer-Aided Civil and Infrastructure Engineering
    year: 2025
    en:
      title: Asphalt property prediction
      contribution: I used high-throughput molecular dynamics simulations to predict asphalt properties from molecular composition.
    zh:
      title: 基于高通量分子模拟的沥青性能预测
      contribution: 我利用高通量分子动力学模拟，从分子组成出发预测沥青性能。
  - url: https://doi.org/10.1016/j.jclepro.2026.147766
    journal: Journal of Cleaner Production
    year: 2026
    en:
      title: Asphalt–rubber interactions
      contribution: I synthesized evidence on how scrap tire rubber interacts with asphalt and how those interactions affect binder performance.
    zh:
      title: 橡胶与沥青的相互作用
      contribution: 我梳理了废胎胶粉与沥青的相互作用，以及这些作用对改性结合料性能的影响。
  - url: https://doi.org/10.1016/j.conbuildmat.2025.143438
    journal: Construction and Building Materials
    year: 2025
    en:
      title: Dixie Highway field trial
      contribution: I combined lab testing and field evaluation to assess a wet-process asphalt mixture with 22% crumb rubber.
    zh:
      title: Dixie Highway 现场试验
      contribution: 我结合室内性能测试和现场施工验证，评估掺入 22% 胶粉的湿法橡胶沥青混合料。

